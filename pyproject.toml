[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Lokaler Multi-Agent-Orchestrator mit sicherem Workspace und Human-in-the-loop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=1.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
jarvis = "jarvis.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Die eingebauten Modultypen gehoeren zum Programm.
"jarvis.core.modules" = ["typen/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ausdruecklich aufgezaehlt, damit eine neuere ruff-Version nicht ploetzlich
# andere Regeln mitbringt und der Build ohne Codeaenderung rot wird.
select = ["E", "F", "I", "B", "SIM", "UP", "S", "PIE", "PLW"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# In Tests sind harte Werte, assert und Unterprozesse genau richtig.
"tests/*" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
